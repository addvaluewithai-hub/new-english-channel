<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Bagel';src:url(fonts/bagelfatone.woff2) format('woff2');font-display:block}
@font-face{font-family:'Anton';src:url(fonts/anton.woff2) format('woff2');font-display:block}
html,body{margin:0;background:#F5EEE1}</style></head><body><canvas id=c width=1920 height=1080></canvas><script>
window.DUR=1;
(async()=>{await document.fonts.load('100px Bagel');await document.fonts.load('100px Anton');
const c=document.getElementById('c').getContext('2d');
window.render=t=>{c.fillStyle='#F5EEE1';c.fillRect(0,0,1920,1080);
c.font='400px Bagel';c.fillStyle='#B5713F';c.textBaseline='alphabetic';
[['Y',200],['M',700]].forEach(([g,x])=>{const m=c.measureText(g);c.fillText(g,x,500);c.strokeStyle='red';c.strokeRect(x-m.actualBoundingBoxLeft,500-m.actualBoundingBoxAscent,m.actualBoundingBoxLeft+m.actualBoundingBoxRight,m.actualBoundingBoxAscent+m.actualBoundingBoxDescent);
for(let i=1;i<10;i++){c.fillStyle='#000';c.fillRect(x-m.actualBoundingBoxLeft,500-m.actualBoundingBoxAscent+i*(m.actualBoundingBoxAscent)/10,8,2)}c.fillStyle='#B5713F'});
c.font='520px Anton';c.fillStyle='#9fb0d0';c.fillText('LONDON i',1250,1000);
c.font='90px Bagel';c.fillStyle='#E0412F';c.fillText('BUS Hello! I... I Youssef. Sorry?',100,700);
c.font='90px Bagel';c.fillStyle='#1F2A44';c.fillText('ENGLISH SCHOOL am',100,820);
};window.READY=true;})();
</script></body></html>
