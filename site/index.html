<title>يوسف في لندن · تمارين الحلقات</title>
<meta name="description" content="الموقع المصاحب لمسلسل «يوسف في لندن»: بعد كل حلقة اعمل تمارين الحلقة، وراجع الجمل كل يوم عشان تثبت.">

<body>
<section class="hero" aria-label="يوسف في لندن">
  <span class="cloud" style="width:96px;height:30px;left:3%;top:56%" aria-hidden="true"></span>
  <span class="cloud" style="width:64px;height:22px;right:4%;top:50%" aria-hidden="true"></span>
  <span class="cloud" style="width:120px;height:32px;right:12%;top:62%;opacity:.55" aria-hidden="true"></span>
  <div class="wrap">
    <h1>يوسف في لندن</h1>
    <p class="sub">اتعلم إنجليزي مع يوسف وميا <span class="sub-en">— <span class="en">Youssef in London</span></span></p>
    <div class="beans">
      <canvas class="bean" data-bean="mia" data-expr="happy" width="300" height="360" aria-label="ميا"></canvas>
      <canvas class="bean" data-bean="youssef" data-expr="happy" width="300" height="360" aria-label="يوسف"></canvas>
    </div>
  </div>
</section>
<main class="wrap">
  <p class="hint" style="margin-top:14px">شوف الحلقة على يوتيوب… وبعدين تعالى هنا اعمل تمارينها. الجمل بتدخل المراجعة لوحدها.</p>
  <div class="stats">
    <div class="stat"><div class="big">🔥 <span id="streak">0</span></div><div class="lbl" id="streak-lbl">يوم ورا بعض</div></div>
    <div class="stat"><div class="big">📚 <span id="due">0</span></div><div class="lbl">للمراجعة النهارده</div></div>
  </div>
  <section class="card review-card" id="review" aria-labelledby="review-title">
    <div class="txt"><h2 id="review-title">مراجعة النهارده</h2><p id="review-sub">…</p></div>
    <a class="btn teal" id="review-btn" href="review.html">ابدأ</a>
  </section>
  <section class="unit" aria-labelledby="unit-title">
    <div class="ptitle"><h2 id="unit-title">A1 · الوحدة 1</h2><span class="hint" id="unit-meta"></span></div>
    <div class="pbar" id="unit-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div>
    <div class="eps" id="eps"></div>
  </section>
</main>
<footer class="site">يوسف في لندن · تمارين الحلقات · اتعمل بحب للي بيتعلموا إنجليزي</footer>
